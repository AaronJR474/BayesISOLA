[build-system]
requires = ["scikit-build-core>=1.0.3"]
build-backend = "scikit_build_core.build"

[project]
name = "BayesISOLA"
version = "0.2.0"
description = "Centroid moment-tensor inversion with BayesISOLA"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
dependencies = [
    "matplotlib",
    "numpy",
    "obspy>=1.5.0",
    "pandas",
    "pyproj",
    "requests",
    "scipy",
    "threadpoolctl",
    "tqdm",
]

[project.optional-dependencies]
notebook = ["ipython"]
pyfk = ["pyfk"]
docs = ["sphinx"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/AaronJR474/BayesISOLA"
"Original repository" = "https://github.com/vackar/BayesISOLA"
"Legacy documentation" = "https://geo.mff.cuni.cz/~vackar/BayesISOLA/"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.17"
wheel.packages = ["BayesISOLA"]
wheel.py-api = "py3"
sdist.include = [
    "BayesISOLA/**",
    "fortran/**",
    "examples/**",
    "tests/**",
    "docs/**",
    "CMakeLists.txt",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    ".gitattributes",
    ".gitignore",
]
